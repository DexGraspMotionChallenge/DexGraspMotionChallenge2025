# One DAgger-style round: offline routed distillation plus student-visited states.
seed: 2025

name: train_lhm_bc
exp_dir: ../custom_tools/runs/bc
run_name: unified_student_online_round1
checkpoint_every_n_epochs: 5
check_val_every_n_epoch: 1

train_data_dir: ./dataset/bc_multicategory_train
test_data_dir: ./dataset/bc_multicategory_valid
train_obj_code_list: null
val_obj_code_list: null

batch_size: 128
num_epochs: 20
seq_num: 395
val_seq_num: 100
category_balanced_sampling: true

add_noise: true
noise_val: 0.05
obs_type: dexrep
seq_normalize: true
num_frame: 70
batch_seq_flat: true
start_frame_pad: false
use_sim_action: false
infer_clip_sample: true

lr: 2e-5
obs_dim: 100
horizon: 1
obj_glob_feat_file: ./object_code_glob_feat.npy

distillation:
  enabled: true
  teacher_action_file: ../custom_tools/data/distillation/routed_teacher_train395.npz
  online_action_file: ../custom_tools/data/distillation/online_round1_train.npz
  teacher_weight: 0.70
  demo_weight: 0.30

policy:
  actor_critic: ActorCriticDexRep
  pi_hid_sizes: [1024, 1024, 512, 512]
  vf_hid_sizes: [1024, 1024, 512, 512]
  activation: elu
  actions_shape: 28

encoder:
  freeze: true
  emb_dim: 128
  n_obs_steps: 1
  bn_type: part

learn:
  init_noise_std: 0.8
